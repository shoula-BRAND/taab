<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She Beauty | عالم الأناقة والجمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff85a2;
            --primary-hover: #f16b8d;
            --secondary-color: #fef1f3;
            --dark-color: #2b2d42;
            --gray-color: #6c757d;
            --light-gray: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(255, 133, 162, 0.15);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #fffafb;
            color: var(--dark-color);
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .logo span { color: var(--dark-color); }

        .hero {
            margin-top: 80px;
            padding: 100px 5% 60px;
            text-align: center;
            background: linear-gradient(135deg, #fff5f7 0%, #fef1f3 100%);
            position: relative;
        }

        .hero h1 {
            font-size: 42px;
            color: var(--dark-color);
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        .hero h1 span { color: var(--primary-color); }

        .hero p {
            font-size: 18px;
            color: var(--gray-color);
            max-width: 600px;
            margin: 0 auto 30px;
            animation: fadeInUp 1s ease-out;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .main-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .main-form { grid-template-columns: 1fr; }
            .hero h1 { font-size: 32px; }
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 35px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 133, 162, 0.1);
            transition: var(--transition);
            animation: fadeInUp 1.2s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 133, 162, 0.25);
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--dark-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i { color: var(--primary-color); }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--dark-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-size: 15px;
            transition: var(--transition);
            outline: none;
            background-color: var(--light-gray);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background-color: var(--white);
            box-shadow: 0 0 0 4px rgba(255, 133, 162, 0.1);
        }

        .file-upload {
            position: relative;
            display: block;
            border: 2px dashed var(--primary-color);
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            background-color: var(--secondary-color);
            transition: var(--transition);
        }

        .file-upload:hover { background-color: #fde2e7; }

        .file-upload input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .file-upload i {
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .image-preview {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
            margin-top: 15px;
            display: none;
            border: 2px solid var(--primary-color);
            animation: pulse 2s infinite;
        }

        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .payment-option {
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .payment-option input { accent-color: var(--primary-color); }
        .payment-option:hover { border-color: var(--primary-color); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #f16b8d 100%);
            color: var(--white);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.5);
        }

        .btn:disabled {
            background: #cccccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .success-overlay.active { opacity: 1; pointer-events: auto; }

        .success-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .success-overlay.active .success-card { transform: scale(1); }

        .success-card i { font-size: 60px; color: #2ec4b6; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">She <span>Beauty</span></div>
        <div style="font-size: 18px; color: var(--primary-color);"><i class="fa-solid fa-bag-shopping"></i></div>
    </header>

    <section class="hero">
        <h1>صممي تجربة تسوقك مع <span>She Beauty</span></h1>
        <p>ارفعي صورة المنتج المفضل لديكِ وضعي الرابط الخاص به، وسنتولى نحن بقية التفاصيل لتصلكِ حتى باب المنزل.</p>
    </section>

    <main class="container">
        <form id="order-form" action="https://formspree.io/f/mqejdpkp" method="POST" class="main-form">
            
            <section class="card">
                <div class="card-title">
                    <i class="fa-solid fa-cart-plus"></i>
                    <h2>كارت المنتج الخاص بكِ</h2>
                </div>
                
                <div class="form-group">
                    <label>صورة المنتج</label>
                    <label class="file-upload">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p id="upload-text">اضغطي هنا لرفع صورة المنتج</p>
                        <input type="file" id="product-image" accept="image/*" required>
                    </label>
                    <center><img id="preview" class="image-preview" alt="معاينة المنتج"></center>
                </div>

                <div class="form-group">
                    <label for="product-link">رابط (لينك) المنتج</label>
                    <input type="url" id="product-link" class="form-control" placeholder="https://example.com/product" required>
                </div>
            </section>

            <section class="card">
                <div class="card-title">
                    <i class="fa-solid fa-credit-card"></i>
                    <h2>تفاصيل الشحن والدفع (Checkout)</h2>
                </div>

                <div class="form-group">
                    <label for="full-name">الاسم بالكامل</label>
                    <input type="text" id="full-name" class="form-control" placeholder="الاسم ثلاثي" required>
                </div>

                <div class="form-group">
                    <label for="phone-number">رقم الهاتف</label>
                    <input type="tel" id="phone-number" class="form-control" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="address">العنوان بالتفصيل</label>
                    <textarea id="address" class="form-control" rows="3" placeholder="المحافظة، المدينة، اسم الشارع، رقم العقار" required></textarea>
                </div>

                <div class="form-group">
                    <label>طريقة الدفع المفضلة</label>
                    <div class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="طريقة الدفع" value="الدفع عند الاستلام" checked>
                            <span>الدفع عند الاستلام</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="طريقة الدفع" value="محفظة إلكترونية">
                            <span>محفظة إلكترونية</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">ملاحظات إضافية (اختياري)</label>
                    <textarea id="notes" class="form-control" rows="2" placeholder="أي تفاصيل أخرى تريدين إخبارنا بها..."></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn">تأكيد الطلب الآن</button>
            </section>
            
        </form>
    </main>

    <div class="success-overlay" id="successModal">
        <div class="success-card">
            <i class="fa-solid fa-circle-check"></i>
            <h2>شكراً لطلبكِ</h2>
            <p style="color: var(--gray-color); margin-top: 12px; font-size: 16px; font-weight: 600; line-height: 1.6;">سيتم تواصل معكِ من فريق العمل بأسرع وقت.</p>
            <button class="btn" style="margin-top: 25px; background: var(--dark-color);" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('product-image');
        const previewImage = document.getElementById('preview');
        const uploadText = document.getElementById('upload-text');
        let selectedFile = null;

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                selectedFile = file;
                uploadText.textContent = `تم اختيار: ${file.name}`;
                
                const reader = new FileReader();
                reader.addEventListener('load', function() {
                    previewImage.setAttribute('src', this.result);
                    previewImage.style.display = 'block';
                });
                reader.readAsDataURL(file);
            }
        });

        const form = document.getElementById('order-form');
        const submitBtn = document.getElementById('submit-btn');
        const modal = document.getElementById('successModal');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            if(!selectedFile) {
                alert('من فضلكِ قومي برفع صورة للمنتج أولاً في الكارت.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري معالجة وإرسال طلبكِ...';

            // الخطوة 1: رفع الصورة إلى سيرفر خارجي مجاني ومفتوح لتخطي قيود الحجم لـ Formspree
            const imgData = new FormData();
            imgData.append('image', selectedFile);

            // نستخدم مفتاح ربط عام ومجاني لرفع الصور الفوري
            fetch('https://api.imgbb.com/1/upload?key=6dad906b3fa24419cb7596b5fc91f630', {
                method: 'POST',
                body: imgData
            })
            .then(res => res.json())
            .then(imgResponse => {
                if(imgResponse.success) {
                    const uploadedImageUrl = imgResponse.data.url; // هذا هو رابط الصورة المباشر النظيف

                    // الخطوة 2: صياغة البيانات النهائية وإرسالها لـ Formspree كـ نص خفيف جداً ومضمون
                    const finalData = new FormData();
                    finalData.append("الاسم بالكامل", document.getElementById('full-name').value);
                    finalData.append("رقم الهاتف", document.getElementById('phone-number').value);
                    finalData.append("رابط المنتج الأصلي", document.getElementById('product-link').value);
                    finalData.append("العنوان بالتفصيل", document.getElementById('address').value);
                    finalData.append("طريقة الدفع", document.querySelector('input[name="طريقة الدفع"]:checked').value);
                    finalData.append("ملاحظات العميلة", document.getElementById('notes').value);
                    finalData.append("رابط صورة المنتج المرفوعة", uploadedImageUrl); // إرسال كرابط انترنت خفيف جداً

                    return fetch(form.action, {
                        method: form.method,
                        body: finalData,
                        headers: { 'Accept': 'application/json' }
                    });
                } else {
                    throw new Error('فشل رفع الصورة');
                }
            })
            .then(response => {
                if (response && response.ok) {
                    modal.classList.add('active');
                } else {
                    alert('حدث خطأ أثناء تسجيل البيانات في Formspree، يرجى المحاولة مرة أخرى.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'تأكيد الطلب الآن';
                }
            })
            .catch(error => {
                alert('حدث خطأ في الاتصال بالشبكة أو حجم الصورة. يرجى إعادة المحاولة بسكرين شوت أو صورة أخرى.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'تأكيد الطلب الآن';
            });
        });

        function closeModal() {
            modal.classList.remove('active');
            form.reset();
            previewImage.style.display = 'none';
            uploadText.textContent = "اضغطي هنا لرفع صورة المنتج";
            selectedFile = null;
            submitBtn.disabled = false;
            submitBtn.textContent = 'تأكيد الطلب الآن';
        }
    </script>
</body>
</html>
